name: Terraform CI-CD

on:
  push:
    branches:
      - feature
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  TF_WORKING_DIR: ./Enviroment/Devlopment

jobs:

  # ==========================================
  # TERRAFORM PLAN
  # ==========================================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # ==========================================
      # AZURE LOGIN
      # App Registration + Client Secret
      # NO GitHub Secret
      # NO Federated Credential
      # ==========================================
      - name: Azure Login
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          creds: |
            {
              "clientId": "7a8e96d0-1e46-4e44-8553-7598eef4f67e",
              "clientSecret": "IoP8Q~5ow24vBdtKJiyNzHy9xsziAx4Gl9TGHc.P",
              "subscriptionId": "2eeb0869-d474-4f94-a0b0-fb6a5d23d142",
              "tenantId": "093e9319-5648-4618-8c7d-f585fb2ed3f9"
            }

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan


  # ==========================================
  # TERRAFORM APPLY
  # ONLY MAIN BRANCH
  # ==========================================
  terraform-apply:
    name: Terraform Apply
    needs: terraform-plan

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    # Manual approval before Apply
    environment:
      name: production

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # ==========================================
      # AZURE LOGIN
      # ==========================================
      - name: Azure Login
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          creds: |
            {
              "clientId": "7a8e96d0-1e46-4e44-8553-7598eef4f67e",
              "clientSecret": "IoP8Q~5ow24vBdtKJiyNzHy9xsziAx4Gl9TGHc.P",
              "subscriptionId": "2eeb0869-d474-4f94-a0b0-fb6a5d23d142",
              "tenantId": "093e9319-5648-4618-8c7d-f585fb2ed3f9"
            }

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve