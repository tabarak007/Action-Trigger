name: Terraform CI-CD

on:
  push:
    branches:
      - feature
      - main

  pull_request:
    branches:
      - main

env:
  TF_WORKING_DIR: ./Enviroment/Devlopment

permissions:
  contents: write
  pull-requests: write

jobs:

  # ==========================================================
  # FEATURE / PR - TERRAFORM PLAN
  # ==========================================================

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # ======================================================
      # AZURE LOGIN USING CLIENT SECRET
      # ======================================================

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "7a8e96d0-1e46-4e44-8553-7598eef4f67e",
              "clientSecret": "IoP8Q~5ow24vBdtKJiyNzHy9xsziAx4Gl9TGHc.P",
              "subscriptionId": "2eeb0869-d474-4f94-a0b0-fb6a5d23d142",
              "tenantId": "093e9319-5648-4618-8c7d-f585fb2ed3f9"
            }

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan


  # ==========================================================
  # AUTOMATIC PR
  # FEATURE → MAIN
  # ==========================================================

  create-pr:
    name: Create PR Feature to Main

    needs: terraform-plan

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/feature'

    runs-on: ubuntu-latest

    steps:

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          gh pr create \
            --base main \
            --head feature \
            --title "Terraform Changes - Feature to Main" \
            --body "Automatic PR created after successful Terraform Plan."

        continue-on-error: true


  # ==========================================================
  # MAIN BRANCH - TERRAFORM PLAN
  # ==========================================================

  terraform-main-plan:
    name: Terraform Plan - Main

    runs-on: ubuntu-latest

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # ======================================================
      # AZURE LOGIN USING CLIENT SECRET
      # ======================================================

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "7a8e96d0-1e46-4e44-8553-7598eef4f67e",
              "clientSecret": "IoP8Q~5ow24vBdtKJiyNzHy9xsziAx4Gl9TGHc.P",
              "subscriptionId": "2eeb0869-d474-4f94-a0b0-fb6a5d23d142",
              "tenantId": "093e9319-5648-4618-8c7d-f585fb2ed3f9"
            }

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}/tfplan


  # ==========================================================
  # APPLY
  # MAIN → MANUAL APPROVAL → APPLY
  # ==========================================================

  terraform-apply:
    name: Terraform Apply

    needs: terraform-main-plan

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    # Manual approval
    environment:
      name: production

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # ======================================================
      # AZURE LOGIN USING CLIENT SECRET
      # ======================================================

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan