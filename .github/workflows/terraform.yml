name: Terraform CI-CD

on:

  # --------------------------------------------------
  # Feature branch push
  # --------------------------------------------------

  push:
    branches:
      - feature
      - main

  # --------------------------------------------------
  # Pull Request to main
  # --------------------------------------------------

  pull_request:
    branches:
      - main


# ======================================================
# GLOBAL ENVIRONMENT
# ======================================================

env:
  TF_WORKING_DIR: ./Action-Trigger/Enviroment/Devlopment


# ======================================================
# PERMISSIONS
# ======================================================

permissions:
  contents: write
  pull-requests: write


# ======================================================
# JOB 1
# TERRAFORM PLAN
#
# Runs on:
# 1. Feature branch push
# 2. Pull Request to main
# ======================================================

jobs:

  terraform-plan:

    name: Terraform Plan

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------
      # Checkout Code
      # ------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # ------------------------------------------------
      # Setup Terraform
      # ------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8


      # ------------------------------------------------
      # Azure Login
      # HARD-CODED FOR PRACTICE
      # ------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: "7a8e96d0-1e46-4e44-8553-7598eef4f67e"

          client-secret: "YOUR_CLIENT_SECRET_VALUE"

          tenant-id: "093e9319-5648-4618-8c7d-f585fb2ed3f9"

          subscription-id: "2eeb0869-d474-4f94-a0b0-fb6a5d23d142"


      # ------------------------------------------------
      # Terraform Init
      # ------------------------------------------------

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init


      # ------------------------------------------------
      # Terraform Format Check
      # ------------------------------------------------

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check


      # ------------------------------------------------
      # Terraform Validate
      # ------------------------------------------------

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate


      # ------------------------------------------------
      # Terraform Plan
      # ------------------------------------------------

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan


# ======================================================
# JOB 2
# AUTOMATIC PR
#
# Feature → Main
#
# Runs ONLY when feature branch is pushed
# ======================================================

  create-pr:

    name: Create PR Feature to Main

    needs: terraform-plan

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/feature'

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------
      # Create Pull Request
      # ------------------------------------------------

      - name: Create Pull Request

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          gh pr create \
            --base main \
            --head feature \
            --title "Terraform Changes - Feature to Main" \
            --body "Automatic PR created after successful Terraform Plan."

        continue-on-error: true


# ======================================================
# JOB 3
# MAIN BRANCH TERRAFORM PLAN
#
# Runs ONLY when code is pushed to main
#
# This normally happens after PR merge
# ======================================================

  terraform-main-plan:

    name: Terraform Plan - Main

    runs-on: ubuntu-latest

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:

      # ------------------------------------------------
      # Checkout Code
      # ------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # ------------------------------------------------
      # Setup Terraform
      # ------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8


      # ------------------------------------------------
      # Azure Login
      # HARD-CODED FOR PRACTICE
      # ------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: "7a8e96d0-1e46-4e44-8553-7598eef4f67e"

          client-secret: "YOUR_CLIENT_SECRET_VALUE"

          tenant-id: "093e9319-5648-4618-8c7d-f585fb2ed3f9"

          subscription-id: "2eeb0869-d474-4f94-a0b0-fb6a5d23d142"


      # ------------------------------------------------
      # Terraform Init
      # ------------------------------------------------

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init


      # ------------------------------------------------
      # Terraform Validate
      # ------------------------------------------------

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate


      # ------------------------------------------------
      # Terraform Plan
      #
      # -out creates a plan file
      # ------------------------------------------------

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -out=tfplan


      # ------------------------------------------------
      # Upload Plan Artifact
      # ------------------------------------------------

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4

        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}/tfplan


# ======================================================
# JOB 4
# TERRAFORM APPLY
#
# Runs ONLY on main
#
# Manual approval comes from:
# GitHub Environment → production
# ======================================================

  terraform-apply:

    name: Terraform Apply

    needs: terraform-main-plan

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest


    # --------------------------------------------------
    # MANUAL APPROVAL
    # --------------------------------------------------

    environment:
      name: production


    steps:

      # ------------------------------------------------
      # Checkout Code
      # ------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # ------------------------------------------------
      # Setup Terraform
      # ------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8


      # ------------------------------------------------
      # Azure Login
      # HARD-CODED FOR PRACTICE
      # ------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: "7a8e96d0-1e46-4e44-8553-7598eef4f67e"

          client-secret: "YOUR_CLIENT_SECRET_VALUE"

          tenant-id: "093e9319-5648-4618-8c7d-f585fb2ed3f9"

          subscription-id: "2eeb0869-d474-4f94-a0b0-fb6a5d23d142"


      # ------------------------------------------------
      # Terraform Init
      # ------------------------------------------------

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init


      # ------------------------------------------------
      # Download Plan
      # ------------------------------------------------

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4

        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}


      # ------------------------------------------------
      # Terraform Apply
      # ------------------------------------------------

      - name: Terraform Apply

        working-directory: ${{ env.TF_WORKING_DIR }}

        run: terraform apply -auto-approve tfplan